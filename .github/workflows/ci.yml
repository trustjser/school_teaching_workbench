name: CI

# 持续集成：在每次 push / PR 到 main 时运行。
# 轻量校验，不做原生打包（原生打包在 release.yml 中进行）。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # 工具链唯一来源，release.yml 与 src-tauri/Cargo.toml 的 rust-version 需同步。
  #
  # 为什么不能再用 1.77.2：Cargo.lock 的依赖树 MSRV 已涨到 1.88
  # （darling 0.23 / time 0.3.55 / plist 1.10.1 / icu 2.3 等，且 40+ 个包为 edition 2024，
  # 光 edition2024 就要求 Cargo >= 1.85）。低于 1.88 会在解析依赖时报
  # `feature 'edition2024' is required ... not stabilized in this version of Cargo`。
  # 升级依赖后若 CI 报同类错误，先把此值提上去。
  RUST_TOOLCHAIN: "1.96.1"

jobs:
  # ---------- 前端：类型检查 + 静态边界检查 + 双端构建 ----------
  frontend:
    name: Frontend typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: App boundary check
        run: npm run check:boundaries

      - name: Build-target check
        run: npm run check:build-targets

      - name: Build affairs frontend
        run: npm run build:affairs

      - name: Build classroom frontend
        run: npm run build:classroom

  # ---------- Rust：fmt / clippy / check / test ----------
  rust:
    name: Rust check & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Cargo fmt check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Cargo clippy
        # 当前不开启 -D warnings，避免历史告警阻塞流水线；
        # 待代码整洁后可将末尾改为 `-- -D warnings`。
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Cargo test
        # lib 层单元测试（设置迁移 / 换届 / 同步 worker 等）。
        run: cargo test --manifest-path src-tauri/Cargo.toml
