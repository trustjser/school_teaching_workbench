name: Release

# 发布 / 部署：打 tag（v*）时触发，三 OS 矩阵原生打包双端（教务端 + 班级端），
# 产物作为 Release 资源上传到 GitHub Releases，即完成「部署」。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # 与 .github/workflows/ci.yml 保持同一个工具链来源。
  # 依赖树 MSRV 为 1.88（详见 ci.yml 注释），1.77.2 会因 edition2024 直接构建失败。
  RUST_TOOLCHAIN: "1.96.1"

# ---------- 关于代码签名：本项目三平台都不签名 ----------
# ⚠️ 千万不要把 secrets 直接映射成 workflow 级 env（例如
#      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
#    ）。「未配置的 secret」会展开成**空字符串**而不是「未设置」，而 Tauri 判断是否要做
#    macOS 签名用的是 `var_os("APPLE_CERTIFICATE")`——**没有 is_empty 判断**，于是它会给
#    `security import` 喂一个 0 字节的 p12，直接报：
#      security: SecKeychainItemImport: One or more parameters passed to a function were not valid.
#      failed to bundle project: failed codesign application: failed to import keychain certificate
#    而 Tauri v2 根本不读 WINDOWS_CERTIFICATE（实测 CLI 二进制里连字符串都没有），
#    写了也只是误导。将来若要启用签名，请**只在 macos 的 build 步骤内按需注入**（例如
#    用 `>> $GITHUB_ENV` 且仅当变量非空时写入），不要写回这里。
#
# 同理，未签名的构建产物在 macOS 首次打开需要右键 → 打开（Gatekeeper 会拦一次）。

jobs:
  build:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ---------- 各 OS 系统依赖 ----------
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      # Windows / macOS 自带 WebView（WebView2 / WKWebView），无需额外系统依赖。
      # （本项目不做 Windows 签名；Tauri v2 也没有 WINDOWS_CERTIFICATE 这个环境变量，
      #   真要签名得走 bundle.windows.signCommand + certificateThumbprint。）

      - name: Install npm dependencies
        run: npm ci

      # ---------- 原生打包：教务端 ----------
      - name: Tauri build (affairs / 教务端)
        run: npm run tauri:build:affairs

      # ---------- 原生打包：班级端 ----------
      - name: Tauri build (classroom / 班级端)
        run: npm run tauri:build:classroom

      # 仅用于排错，永不判失败。
      # 原写法 `ls -R <dir> | head -60` 在 `shell: bash` 下（GitHub 默认带 -eo pipefail）
      # 一旦 ls 因无法访问/SIGPIPE 返回非 0，整步就会被判失败（实测 exit 2），
      # 把「列目录」这种纯诊断动作变成了流水线的拦路虎。这里先落盘再截取，彻底避开 SIGPIPE。
      - name: List bundle output (diagnostic)
        if: always()
        shell: bash
        run: |
          bundle_dir="src-tauri/target/release/bundle"
          if [ -d "$bundle_dir" ]; then
            echo "=== $bundle_dir ==="
            ls -R "$bundle_dir" > bundle-list.txt 2>&1 || true
            head -80 bundle-list.txt
            echo "=== 安装包数量 ==="
            find "$bundle_dir" -maxdepth 3 -type f \
              \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
                 -o -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \) | sort
          else
            echo "::warning::$bundle_dir 不存在，本次没有产出任何安装包"
          fi

      # 上传前断言真的有产物，避免「job 绿了但 Release 是空的」
      - name: Assert bundles produced
        shell: bash
        run: |
          n=$(find src-tauri/target/release/bundle -maxdepth 3 -type f \
                \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
                   -o -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \) \
                2>/dev/null | wc -l | tr -d ' ')
          echo "安装包数量: $n"
          if [ "$n" -eq 0 ]; then
            echo "::error::未找到任何安装包产物，请检查上面的 Tauri build 日志"
            exit 1
          fi

      # ---------- 上传到 GitHub Release ----------
      # 只上传安装包本体：原先的 `bundle/**/*` 会把 deb/rpm/appimage 的**解包目录**、
      # macOS .app 的内部文件全当成 release 资源（成百上千个文件），既乱又慢。
      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
