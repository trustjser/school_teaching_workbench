<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="局域网教务与班级协同工作台">
  <defs>
    <linearGradient id="plate" x1="0.12" y1="0" x2="0.88" y2="1">
      <stop offset="0" stop-color="#5AA2FF"/>
      <stop offset="0.46" stop-color="#2B7BF0"/>
      <stop offset="1" stop-color="#123F8C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.26" cy="0.14" r="0.85">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#0A2B66" stop-opacity="0"/>
      <stop offset="1" stop-color="#0A2B66" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="cardFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E8F1FF"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC94F"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="cardShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#08275E" flood-opacity="0.38"/>
    </filter>
    <filter id="badgeShadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#08275E" flood-opacity="0.42"/>
    </filter>
    <clipPath id="plateClip">
      <rect width="1024" height="1024" rx="235"/>
    </clipPath>
  </defs>

  <g clip-path="url(#plateClip)">
    <rect width="1024" height="1024" fill="url(#plate)"/>
    <rect width="1024" height="1024" fill="url(#glow)"/>
    <rect width="1024" height="1024" fill="url(#vignette)"/>
  </g>

  <!-- 课表卡 -->
  <g>
    <g filter="url(#cardShadow)">
      <rect x="223" y="371" width="460" height="400" rx="80" fill="url(#cardFace)"/>
    </g>
    <g fill="#2B7BF0">
      <rect x="265" y="413" width="108" height="88" rx="24"/>
      <rect x="399" y="413" width="108" height="88" rx="24"/>
      <rect x="533" y="413" width="108" height="88" rx="24"/>
      <rect x="265" y="527" width="108" height="88" rx="24"/>
      <rect x="399" y="527" width="108" height="88" rx="24"/>
      <rect x="533" y="527" width="108" height="88" rx="24"/>
      <rect x="265" y="641" width="108" height="88" rx="24"/>
      <rect x="399" y="641" width="108" height="88" rx="24"/>
      <rect x="533" y="641" width="108" height="88" rx="24"/>
    </g>
  </g>

  <!-- 局域网同步徽章 -->
  <g>
    <circle cx="683" cy="371" r="104" fill="url(#badge)" filter="url(#badgeShadow)"/>
    <g transform="translate(683 371) scale(0.88)"><g stroke="#FFFFFF" stroke-width="25" stroke-linecap="round" fill="none">
      <path d="M -57.2 -24 A 62 62 0 0 1 53.7 -31"/>
      <path d="M 57.2 24 A 62 62 0 0 1 -53.7 31"/>
    </g></g>
    <g fill="#FFFFFF" transform="translate(683 371) scale(0.88)">
      <path d="M 2 -17 L 32 0 L 2 17 Z" transform="translate(53.7 -31) rotate(60)"/>
      <path d="M 2 -17 L 32 0 L 2 17 Z" transform="translate(-53.7 31) rotate(240)"/>
    </g>
  </g>
</svg>
